name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (both tsconfigs)
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Notebook tests
        run: npm run test:notebook

      - name: Electron suite (sandbox + agent)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Electron needs a display even for main-process-only tests.
            xvfb-run -a npx electron test/sandbox-and-agent.test.mjs
          else
            npx electron test/sandbox-and-agent.test.mjs
          fi
